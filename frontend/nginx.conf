server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠ SPA 必備設定。
    # Vue Router 用的是「history 模式」，網址長得像 /stations/93。
    # 但伺服器上根本沒有那個檔案，直接重新整理就會 404。
    # try_files 的意思是：找不到檔案就一律回 index.html，
    # 讓瀏覽器裡的 Vue Router 自己去決定要顯示哪一頁。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 靜態資源快取一年。檔名帶 hash，內容變了檔名就變，不會拿到舊的。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
