spring.application.name=townquest-api

# FastAPI 版佔用 8000，這個版本用 8081，兩個可以同時跑、方便比對
server.port=${PORT:8081}

# ── 資料庫 ──────────────────────────────────────────────
# 跟 FastAPI 版共用同一個 PostgreSQL。
# 環境變數 SPRING_DATASOURCE_URL / USERNAME / PASSWORD 會自動覆蓋這三行，
# Docker 裡就是這樣把主機名稱換成 db 的（設定與程式碼分離）。
spring.datasource.url=jdbc:postgresql://localhost:5432/townquest
spring.datasource.username=townquest
spring.datasource.password=townquest

# ⚠ validate：啟動時只「檢查」Entity 跟資料表對不對得上，絕不改表。
# 資料表的建立與版本管理一律交給 FastAPI 版的 Alembic。
# 兩邊都能改表的話，遲早會互相打架。
spring.jpa.hibernate.ddl-auto=validate

# 關掉 Open Session In View。
# 開著的話，JSON 序列化時還能偷偷觸發 lazy loading 查資料庫 ——
# N+1 問題會藏在看不到的地方。關掉之後，該查的一定要在 Service 裡查完。
spring.jpa.open-in-view=false

# 開發時想看 Hibernate 實際產生的 SQL（抓 N+1 用），把這行改成 true
spring.jpa.show-sql=false

# ── JSON ────────────────────────────────────────────────
# Java 慣例是 camelCase（externalId），但 FastAPI 版回的是 snake_case（external_id）。
# 為了讓 Vue 前端一行都不用改，JSON 欄位名稱統一轉成 snake_case。
spring.jackson.property-naming-strategy=SNAKE_CASE

# ── CORS ────────────────────────────────────────────────
# 允許呼叫這個 API 的前端網址，跟 FastAPI 版一樣由環境變數 CORS_ORIGINS 決定
app.cors-origins=${CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080}
